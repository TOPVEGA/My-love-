<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>❤️ حبيبتي الغالية ❤️</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 50%, #1a0533, #0d0221, #2d0a4e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: rtl;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== خلفية زجاجية متحركة ===== */
        .glass-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.15), transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(155, 89, 182, 0.2), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03), transparent 70%);
            animation: glassMove 8s ease-in-out infinite alternate;
        }

        @keyframes glassMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        /* ===== جزيئات متلألئة ===== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ffd700, #9b59b6);
            border-radius: 50%;
            animation: floatParticle 12s infinite alternate;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.2; }
            100% { transform: translateY(-100vh) translateX(100px) scale(2); opacity: 0.9; }
        }

        /* ===== البطاقة الرئيسية ===== */
        .glass-card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 50px;
            padding: 30px 28px 35px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            transition: all 0.5s ease;
        }

        /* ===== شريط التحكم بالموسيقى ===== */
        .music-bar {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 22px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .music-bar .track-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            flex: 1;
            min-width: 120px;
        }

        .music-bar .track-info i {
            color: #ffd700;
            font-size: 1.2rem;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .music-controls button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-controls button:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            transform: scale(1.05);
        }

        .music-controls button.playing {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.3); }
            70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        .music-progress {
            flex: 1;
            min-width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .music-progress .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #9b59b6);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* ===== أزرار اللغة ===== */
        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.4s ease;
            font-family: 'Tajawal', sans-serif;
        }

        .lang-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
            color: #fff;
            transform: translateY(-2px);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(155, 89, 182, 0.3));
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }

        /* ===== العنوان ===== */
        .hero-title {
            text-align: center;
            margin: 6px 0 12px;
        }

        .hero-title h1 {
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #f1c40f, #9b59b6, #8e44ad);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite alternate;
            text-shadow: none;
            letter-spacing: 2px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero-title .sub-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            margin-top: 4px;
            letter-spacing: 3px;
        }

        /* ===== تاريخ الميلاد ===== */
        .birthday-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 10px 22px;
            margin: 8px auto 14px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .birthday-box span {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 1px;
        }

        .birthday-box i {
            color: #ffd700;
            margin-left: 8px;
        }

        /* ===== العمر الحي ===== */
        .age-counter {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border-radius: 80px;
            padding: 14px 20px;
            margin: 12px 0 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px 22px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .age-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
        }

        .age-item .num {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 40px;
            text-align: center;
        }

        .age-item .label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        /* ===== معرض الصور المتحرك ===== */
        .gallery-section {
            margin: 18px 0 20px;
        }

        .gallery-title {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .gallery-slider {
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .gallery-slider .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gallery-slider .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
        }

        .gallery-slider .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 30px;
        }

        .gallery-slider .slide .slide-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 8px 24px;
            border-radius: 30px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        .gallery-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
        }

        .gallery-nav button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .gallery-nav button:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
            color: #ffd700;
            transform: scale(1.05);
        }

        .gallery-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .gallery-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .gallery-dots .dot.active {
            background: #ffd700;
            width: 24px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* ===== الرسالة ===== */
        .love-letter {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 20px 22px;
            margin: 18px 0 20px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.04);
            line-height: 1.9;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
            scroll-behavior: smooth;
        }

        .love-letter::-webkit-scrollbar {
            width: 3px;
        }
        .love-letter::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
        }
        .love-letter::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ffd700, #9b59b6);
            border-radius: 20px;
        }

        /* ===== زر القلب ===== */
        .heart-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 6px 0 14px;
        }

        .heart-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 215, 0, 0.2);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.05);
        }

        .heart-btn:hover {
            transform: scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.1);
        }

        .heart-btn:active {
            transform: scale(0.85);
        }

        /* ===== الأيقونات ===== */
        .footer-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .footer-icons .icon-item {
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            transition: all 0.3s ease;
            cursor: default;
        }

        .footer-icons .icon-item:hover {
            color: #ffd700;
            transform: scale(1.1);
        }

        /* ===== ترجمة المحتوى ===== */
        .lang-content {
            transition: all 0.5s ease;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .glass-card { padding: 20px 14px; border-radius: 30px; }
            .hero-title h1 { font-size: 1.8rem; }
            .age-item .num { font-size: 1.3rem; min-width: 30px; }
            .music-bar { flex-direction: column; align-items: stretch; gap: 10px; }
            .music-controls { justify-content: center; }
            .gallery-slider { aspect-ratio: 4 / 3; }
            .gallery-slider .slide .slide-text { font-size: 0.7rem; padding: 4px 14px; white-space: normal; }
            .lang-btn { font-size: 0.7rem; padding: 4px 12px; }
        }

        @media (max-width: 400px) {
            .hero-title h1 { font-size: 1.4rem; }
            .age-counter { gap: 4px 10px; padding: 10px 12px; }
            .age-item .num { font-size: 1rem; min-width: 24px; }
            .age-item .label { font-size: 0.6rem; }
        }

        /* ===== تأثير التحميل ===== */
        .glass-card {
            animation: cardAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <!-- ===== الخلفية الزجاجية المتحركة ===== -->
    <div class="glass-bg"></div>

    <!-- ===== جزيئات متلألئة ===== -->
    <div class="particles" id="particles"></div>

    <!-- ===== البطاقة الرئيسية ===== -->
    <div class="glass-card">

        <!-- ===== شريط الموسيقى ===== -->
        <div class="music-bar">
            <div class="track-info">
                <i class="fas fa-compact-disc"></i>
                <span id="trackName">🎵 أغنية حبك ❤️</span>
            </div>
            <div class="music-progress" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="music-controls">
                <button onclick="prevTrack()"><i class="fas fa-step-backward"></i></button>
                <button id="playBtn" onclick="togglePlay()" class="playing"><i class="fas fa-pause"></i></button>
                <button onclick="nextTrack()"><i class="fas fa-step-forward"></i></button>
            </div>
        </div>

        <!-- ===== أزرار اللغة ===== -->
        <div class="lang-bar">
            <button class="lang-btn active" data-lang="ar" onclick="changeLanguage('ar')">🇸🇦 عربي</button>
            <button class="lang-btn" data-lang="en" onclick="changeLanguage('en')">🇬🇧 English</button>
            <button class="lang-btn" data-lang="fr" onclick="changeLanguage('fr')">🇫🇷 Français</button>
        </div>

        <!-- ===== العنوان ===== -->
        <div class="hero-title">
            <h1 id="mainTitle">💖 دي اللي خطفت قلبي 💖</h1>
            <div class="sub-text" id="subTitle">✦ أنتِ كل شيء ✦</div>
        </div>

        <!-- ===== تاريخ الميلاد ===== -->
        <div style="text-align: center;">
            <div class="birthday-box">
                <i class="fas fa-birthday-cake"></i>
                <span id="birthdayText">مايو 07, 2004</span>
            </div>
        </div>

        <!-- ===== العمر الحي ===== -->
        <div class="age-counter" id="ageCounter">
            <div class="age-item"><span class="num" id="years">22</span><span class="label" id="lblYears">سنين</span></div>
            <div class="age-item"><span class="num" id="months">6</span><span class="label" id="lblMonths">شهور</span></div>
            <div class="age-item"><span class="num" id="weeks">28</span><span class="label" id="lblWeeks">أسابيع</span></div>
            <div class="age-item"><span class="num" id="days">198</span><span class="label" id="lblDays">أيام</span></div>
            <div class="age-item"><span class="num" id="hours">12</span><span class="label" id="lblHours">ساعات</span></div>
        </div>

        <!-- ===== معرض الصور المتحرك ===== -->
        <div class="gallery-section">
            <div class="gallery-title" id="galleryTitle">📸 ذكرياتنا الجميلة</div>
            <div class="gallery-slider" id="gallerySlider">
                <div class="slides" id="slidesContainer">
                    <!-- سيتم إنشاء الصور بواسطة JS -->
                </div>
            </div>
            <div class="gallery-nav">
                <button onclick="prevSlide()"><i class="fas fa-chevron-right"></i></button>
                <button onclick="nextSlide()"><i class="fas fa-chevron-left"></i></button>
            </div>
            <div class="gallery-dots" id="dotsContainer"></div>
        </div>

        <!-- ===== الرسالة ===== -->
        <div class="love-letter" id="loveLetter">
            <p id="letterContent">💬 عايز اقولك انك مش مجرد بنت بحبها .. انتي الحياه اللي اتمنيتها من سنين 💫</p>
        </div>

        <!-- ===== زر القلب ===== -->
        <div class="heart-section">
            <div class="heart-btn" id="heartButton">
                <i class="fas fa-heart"></i>
            </div>
        </div>

        <!-- ===== أيقونات ===== -->
        <div class="footer-icons">
            <span class="icon-item"><i class="fas fa-infinity"></i></span>
            <span class="icon-item"><i class="fas fa-star"></i></span>
            <span class="icon-item"><i class="fas fa-heart"></i></span>
            <span class="icon-item"><i class="fas fa-moon"></i></span>
            <span class="icon-item"><i class="fas fa-sun"></i></span>
        </div>

    </div>

    <!-- ===== Audio ===== -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ============================================================
        // 1. جزيئات الخلفية
        // ============================================================
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.width = (Math.random() * 8 + 2) + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (Math.random() * 15 + 8) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.opacity = Math.random() * 0.5 + 0.1;
                container.appendChild(p);
            }
        })();

        // ============================================================
        // 2. معرض الصور المتحرك (باستخدام صور SVG جميلة)
        // ============================================================
        const slidesData = [
            { emoji: '❤️', text: 'حبيبتي الجميلة', bg: 'linear-gradient(135deg, #1a0533, #4a1a6b)' },
            { emoji: '🌹', text: 'وردة حياتي', bg: 'linear-gradient(135deg, #2d0a4e, #6a1b7a)' },
            { emoji: '💕', text: 'حبّي الأبدي', bg: 'linear-gradient(135deg, #1a0533, #8e44ad)' },
            { emoji: '✨', text: 'نور عيني', bg: 'linear-gradient(135deg, #4a1a6b, #ffd700)' },
            { emoji: '🌸', text: 'أجمل بنت', bg: 'linear-gradient(135deg, #6a1b7a, #f39c12)' },
            { emoji: '💖', text: 'روحي وحياتي', bg: 'linear-gradient(135deg, #2d0a4e, #e74c3c)' },
        ];

        let currentSlide = 0;
        const slidesContainer = document.getElementById('slidesContainer');
        const dotsContainer = document.getElementById('dotsContainer');
        let slideInterval;

        function buildGallery() {
            slidesContainer.innerHTML = '';
            dotsContainer.innerHTML = '';
            slidesData.forEach((data, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.style.background = data.bg;
                // نص كبير مع إيموجي
                slide.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;">
                        <div style="font-size:5rem;filter:drop-shadow(0 10px 30px rgba(0,0,0,0.3));">${data.emoji}</div>
                        <div style="color:rgba(255,255,255,0.9);font-size:1.8rem;font-weight:700;text-shadow:0 4px 20px rgba(0,0,0,0.3);">${data.text}</div>
                    </div>
                `;
                slidesContainer.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = 'dot' + (index === 0 ? ' active' : '');
                dot.onclick = () => goToSlide(index);
                dotsContainer.appendChild(dot);
            });
            updateSlide();
        }

        function updateSlide() {
            slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.className = 'dot' + (i === currentSlide ? ' active' : '');
            });
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlide();
            resetInterval();
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slidesData.length;
            updateSlide();
            resetInterval();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + slidesData.length) % slidesData.length;
            updateSlide();
            resetInterval();
        }

        function resetInterval() {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 4000);
        }

        buildGallery();
        slideInterval = setInterval(nextSlide, 4000);

        // ============================================================
        // 3. العمر الحي
        // ============================================================
        const birthDate = new Date(2004, 4, 7, 0, 0, 0, 0);

        function updateAge() {
            const now = new Date();
            let diffMs = now.getTime() - birthDate.getTime();
            if (diffMs < 0) diffMs = 0;

            const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const years = Math.floor(totalDays / 365.2425);
            let rem = totalDays - (years * 365.2425);
            if (rem < 0) rem = 0;
            const months = Math.floor(rem / 30.436875);
            const remDays = Math.floor(rem - (months * 30.436875));
            const weeks = Math.floor(remDays / 7);
            const daysFinal = remDays % 7;
            const hours = now.getHours();

            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('weeks').innerText = weeks;
            document.getElementById('days').innerText = daysFinal;
            document.getElementById('hours').innerText = hours;
        }

        updateAge();
        setInterval(updateAge, 60000);

        let isPlaying = false;
        const playBtn = document.getElementById('playBtn');

        function togglePlay() {
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                playBtn.classList.remove('playing');
            } else {
                music.play().catch(() => {});
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                playBtn.classList.add('playing');
            }
        }

        // تحديث شريط التقدم
        music.addEventListener('timeupdate', () => {
            if (music.duration) {
                const pct = (music.currentTime / music.duration) * 100;
                document.getElementById('progressFill').style.width = pct + '%';
            }
        });

        // النقر على شريط التقدم
        document.getElementById('progressBar').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (music.duration) {
                music.currentTime = pct * music.duration;
            }
        });
